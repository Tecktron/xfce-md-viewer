name: Update vendored assets

# Weekly check for new upstream releases of vendored packages (GitHub CSS,
# KaTeX, Mermaid). For each package with a new version, regenerate its files and
# open a pull request for review.
# Requires repo setting: Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [github-markdown-css, katex, mermaid]
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new version
        id: check
        run: |
          if python3 tools/update_vendored.py --check "${{ matrix.package }}"; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate files
        if: steps.check.outputs.update == 'true'
        id: regen
        run: |
          version=$(python3 tools/update_vendored.py "${{ matrix.package }}" | awk '{print $NF}')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ steps.regen.outputs.version }}
        run: |
          branch="vendored/$PACKAGE-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists; PR already open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A data/styles data/vendor
          git commit -m "Update $PACKAGE to $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update $PACKAGE to $VERSION" \
            --body "Automated update from npm via \`tools/update_vendored.py\`. Check rendering with the affected package before merging, and note the update in debian/changelog at the next release."
