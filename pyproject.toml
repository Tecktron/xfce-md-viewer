[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xfce-md-viewer"
dynamic = ["version"]
description = "GTK4 Markdown viewer for Xfce with multiple flavors and CSS styles"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = []

[project.urls]
"Bug Tracker" = "https://github.com/Tecktron/xfce-md-viewer/issues"
Source = "https://github.com/Tecktron/xfce-md-viewer"

[project.scripts]
md-viewer = "md_viewer.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
]

[tool.setuptools.dynamic]
version = {attr = "md_viewer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    '.idea',
    '.git',
    '.*_cache',
    '.venv',
    'venv',
    '_build',
    'build',
    'dist',
    '.egg-info',
    '.pybuild',
    'debian',
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "S", "C4", "N", "PT", "I", "PTH"]
ignore = ["E501", "S101", "E402", "S603"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["md_viewer"]
branch = true

[tool.coverage.report]
show_missing = true
